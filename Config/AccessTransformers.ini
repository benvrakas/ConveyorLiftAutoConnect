[AccessTransformers]
; Register the manager on blueprint holograms.
Friend=(Class="AFGBlueprintHologram", FriendClass="FConveyorLiftAutoConnectModule")
; Find the hologram's duplicate of a blueprint connection for the connection indicator and the capability check.
Friend=(Class="AFGBlueprintHologram", FriendClass="FLiftEndpoint")

; Hook lift placement validation to drop the transient InvalidFloor of generated bridges.
Friend=(Class="AFGConveyorLiftHologram", FriendClass="FConveyorLiftAutoConnectModule")
; Configure a real lift hologram in the snapped state vanilla placement creates.
Friend=(Class="AFGConveyorLiftHologram", FriendClass="FLiftBridgeHologram")

; Read an attachment's saved connection directions before it runs BeginPlay.
Friend=(Class="AFGBuildableConveyorAttachment", FriendClass="FSeamLinker")
; Refresh a linked lift's floor hole state.
Friend=(Class="AFGBuildableConveyorLift", FriendClass="FSeamLinker")
; Mark conveyor buckets dirty after regrouping a linked conveyor.
Friend=(Class="AFGBuildableSubsystem", FriendClass="FSeamLinker")
; Read conveyor tick groups for the Verbose seam audit.
Friend=(Class="AFGBuildableSubsystem", FriendClass="FSeamAudit")
